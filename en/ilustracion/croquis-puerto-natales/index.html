<script>
(function () {
  var site = document.getElementById('site');
  var cover = document.getElementById('view-inicio');
  var inner = document.getElementById('view-inner');
  // Generated pages carry only their own section or project; the rest load as their own pages
  var sections = ['ilustracion', 'investigacion', 'exposiciones', 'arquitectura', 'sobremi'].filter(function (id) { return document.getElementById(id); });

    // Old links (nicoverdejo.com/#d-...) move to their own address

      document.title = homeTitle[lang];
      window.scrollTo(0, 0);
      return;
    }
    cover.hidden = true; inner.hidden = false;
    sections.forEach(function (id) { document.getElementById(id).hidden = detailEl ? true : (id !== target); });
    var secNode = document.getElementById(target);
    var secPath = secNode ? secNode.getAttribute('data-path') : { ilustracion: '/ilustracion/', investigacion: '/publicaciones/', exposiciones: '/exposiciones/', arquitectura: '/arquitectura/', sobremi: '/sobre-mi/' }[target];

    document.title = lab ? lab + ' · ' + baseTitle : baseTitle;

    if (p.slice(-1) !== '/') p += '/';

  }
  // Inside the site, links change the view without reloading the page
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (a.target || a.hasAttribute('download')) return;
    var url = new URL(a.href, location.href);

    var p = bare(url.pathname);
    if (!has(p)) return;

    var dest = withLang(p, lang) + url.hash;
    if (dest !== location.pathname + location.hash) history.pushState(null, '', dest);

    site.setAttribute('data-lang', l);

    buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.set === l)); });

  // A visitor who chose English before lands in English
  try { if (lang === 'es' && location.pathname === '/' && !location.hash && localStorage.getItem('nv-lang') === 'en') { lang = 'en'; history.replaceState(null, '', '/en/'); } } catch (e) {}
  setLang(lang, true);

  // Sideways rows and sketchbook strips: arrows, count, and a page counter
  function setupStrip(el) {
    var isRow = el.classList.contains('row');
    var nav = document.createElement('div'); nav.className = 'strip-nav';
    var prev = document.createElement('button'); prev.type = 'button'; prev.textContent = '←';

          if (a < left - 2 && b > left + 2) { target = Math.max(a, left - box.width * 0.8); }
          else if (a < left - 2) { target = (r.width > box.width) ? Math.max(a, b - box.width) : a; }

    el.querySelectorAll('img').forEach(function (im) { im.addEventListener('load', update); });
    el._update = update;
    update();
  }

  window.addEventListener('popstate', function () { setTimeout(function () { document.querySelectorAll('[data-strip]').forEach(function (e) { e._update && e._update(); }); }, 50); });
  document.addEventListener('click', function () { setTimeout(function () { document.querySelectorAll('[data-strip]').forEach(function (e) { e._update && e._update(); }); }, 60); });
  route();
  setTimeout(function () { document.querySelectorAll('[data-strip]').forEach(function (e) { e._update && e._update(); }); }, 100);
  buttons.forEach(function (b) { b.addEventListener('click', function () { setLang(b.dataset.set); }); });


  // Cover: the drawings take turns every few seconds; the cursor over the drawing holds the current one
  (function () {
    var box = document.getElementById('slides'), cap = document.getElementById('slide-cap');
    if (!box) return;

    function show(n) {

      i = n % slides.length;
      var el = slides[i];

      var start = box.querySelector('img[src*="cover-plaza-italia"]');

    setInterval(function () { if (!paused && !document.hidden && visible()) show(i + 1); }, DELAY);
    box.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') paused = true; });
    box.addEventListener('pointerleave', function () { paused = false; });
  })();

  var btn = document.getElementById('copy-email');
  if (btn) btn.addEventListener('click', function () {
    var text = document.getElementById('email').textContent;
    var es = btn.querySelector('.es'), en = btn.querySelector('.en');
    var done = function () { es.textContent = 'Copiado'; en.textContent = 'Copied'; setTimeout(function () { es.textContent = 'Copiar'; en.textContent = 'Copy'; }, 1800); };

  });
